<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>University Dental Clinic: Draft Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F6F6; --surface:#FFFFFF; --surface2:#E9F0F1; --ink:#122A30; --muted:#55696F; --line:#D3DFE1;
  --pri:#0B5566; --pri-h:#08424F; --pri-ink:#FFFFFF; --pri-soft:#D9ECF0;
  --ok:#1F7A55; --ok-soft:#DCF0E5; --warn:#7F5300; --warn-soft:#FDEFC3; --bad:#B0344A; --bad-soft:#F9DFE3; --info:#2A5CA8; --info-soft:#E1EAF9;
  --tooth:#FFFFFF; --tooth-line:#6E8990; --dec:#E58A98; --fil:#8DB4E8; --mis:#EEF2F3; --ext:#C4CBCE;
  --shadow:0 1px 2px rgba(18,42,48,.06),0 6px 18px rgba(18,42,48,.05);
  --r:12px; --rs:8px;
  --f-head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D191C; --surface:#152629; --surface2:#1C3236; --ink:#E6F0F1; --muted:#96ACB2; --line:#2A4348;
    --pri:#5CC0D3; --pri-h:#7BD0E0; --pri-ink:#06222A; --pri-soft:#173F48;
    --ok:#62C79A; --ok-soft:#163A2B; --warn:#EDBE55; --warn-soft:#40320F; --bad:#F08A9B; --bad-soft:#45202A; --info:#8DB4F2; --info-soft:#1D3355;
    --tooth:#E4EEF0; --tooth-line:#9DB5BB; --dec:#B5566A; --fil:#4C77B5; --mis:#1C3236; --ext:#4A5A5E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D191C; --surface:#152629; --surface2:#1C3236; --ink:#E6F0F1; --muted:#96ACB2; --line:#2A4348;
  --pri:#5CC0D3; --pri-h:#7BD0E0; --pri-ink:#06222A; --pri-soft:#173F48;
  --ok:#62C79A; --ok-soft:#163A2B; --warn:#EDBE55; --warn-soft:#40320F; --bad:#F08A9B; --bad-soft:#45202A; --info:#8DB4F2; --info-soft:#1D3355;
  --tooth:#E4EEF0; --tooth-line:#9DB5BB; --dec:#B5566A; --fil:#4C77B5; --mis:#1C3236; --ext:#4A5A5E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;line-height:1.2;color:var(--ink)}
h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:600}
p{margin:0 0 10px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px;border-radius:6px}

/* layout */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px}
.brand .mark{width:38px;height:38px;border-radius:11px;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;flex:none}
.brand .mark svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand b{font-family:var(--f-head);font-size:15px;line-height:1.15;display:block}
.brand span{font-size:12px;color:var(--muted)}
.navgrp{font-size:12px;color:var(--muted);padding:12px 10px 4px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--ink);font-weight:500}
.nav button svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
.nav button:hover{background:var(--surface2)}
.nav button.on{background:var(--pri-soft);color:var(--pri);font-weight:600}
.nav button.on svg{color:var(--pri)}
.nav .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px;font-weight:600}
.sidefoot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px;border:1px dashed var(--line);border-radius:10px}
.main{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 24px}
.top .grow{flex:1}
.top .menu{display:none}
.switch{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 12px}
.switch label{font-size:12px;color:var(--muted);font-weight:600}
.switch select{border:0;background:transparent;padding:5px 4px;font-weight:600;max-width:330px}
.iconbtn{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn .dot{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;min-width:18px;line-height:18px;text-align:center;font-weight:600}
.iconbtn.txt{width:auto;padding:0 12px;font-weight:600;font-size:13px}
.proto{background:var(--warn-soft);color:var(--warn);font-size:13px;padding:7px 24px;border-bottom:1px solid var(--line)}
.view{padding:24px;max-width:1240px}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.phead p{color:var(--muted);margin:4px 0 0;max-width:70ch}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* notes */
.notebar{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:var(--rs);padding:8px 12px;margin-bottom:16px;font-size:13px}
.notebar summary{cursor:pointer;display:flex;gap:8px;align-items:center;flex-wrap:wrap;list-style:none}
.notebar summary::-webkit-details-marker{display:none}
.notebar .more{color:var(--pri);font-weight:600;margin-left:auto}
.notebar ul{margin:8px 0 2px;padding-left:18px;color:var(--muted)}
.notebar li{margin:3px 0}
.notebar .txt{color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:1px 10px 1px 2px;font-size:12px;font-weight:600;background:var(--surface2);white-space:nowrap}
.tag i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff}
.tag.A i{background:#1F7A55}.tag.B i{background:#2A5CA8}.tag.C i{background:#8A5A00}.tag.D i{background:#6B4AA8}.tag.E i{background:#B0344A}

/* components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.card h2,.card h3{margin-bottom:10px}
.card .sub{color:var(--muted);font-size:13px;margin:-6px 0 12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.grid + .grid,.grid + .card,.card + .grid{margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;text-align:left;width:100%}
button.stat{cursor:pointer}
button.stat:hover{border-color:var(--pri)}
.stat b{font-family:var(--f-head);font-size:28px;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.stat.alert b{color:var(--bad)}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:9px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;line-height:1.2}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.pri:hover{background:var(--pri-h);color:var(--pri-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.pri{background:var(--pri-soft);color:var(--pri)}
.callout{border-radius:var(--rs);padding:10px 12px;font-size:14px;margin:0 0 14px;background:var(--info-soft);color:var(--ink);border:1px solid var(--line)}
.callout.warn{background:var(--warn-soft)}
.callout.bad{background:var(--bad-soft)}
.callout.ok{background:var(--ok-soft)}
.muted{color:var(--muted)}
.small{font-size:13px}
.right{text-align:right}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--rs);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface2);font-weight:600;font-size:13px;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.grp td{background:var(--surface2);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
.form{display:grid;gap:14px}
.fgrid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.fgrid .full{grid-column:1/-1}
.field label,.field .lbl{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
.field .hint{font-size:12px;color:var(--muted);margin-top:3px}
.field .err{font-size:12px;color:var(--bad);margin-top:3px}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],select.in,textarea,input[type=file]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--rs);padding:9px 11px}
textarea{min-height:78px;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer;font-weight:500;font-size:14px;margin:0;background:var(--surface)}
.checks label:has(input:checked){background:var(--pri-soft);border-color:var(--pri);color:var(--pri)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--pri);color:var(--pri-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px}
.chip:hover{border-color:var(--pri)}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.chip[disabled]{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.chip.closed{background:var(--surface2);color:var(--muted)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:600}
.item .s{color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .a{background:var(--pri)}.bar .b{background:var(--info)}.bar .c{background:var(--warn)}
.barrow{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.filters .field{min-width:150px}
.filters select.in{padding:8px 10px}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.hl{background:var(--warn-soft);border-radius:4px;padding:0 3px}
.diff del{color:var(--bad)}.diff ins{color:var(--ok);text-decoration:none;font-weight:600}
.steps{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.steps span{padding:5px 12px;border-radius:99px;background:var(--surface2);color:var(--muted);font-size:13px;font-weight:600}
.steps span.on{background:var(--pri);color:var(--pri-ink)}
.steps span.done{background:var(--ok-soft);color:var(--ok)}
.stagebar{display:flex;gap:4px;margin-top:6px}
.stagebar i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.stagebar i.on{background:var(--pri)}
.rxwarn{border:1px solid var(--bad);background:var(--bad-soft);border-radius:var(--rs);padding:8px 12px;font-size:14px}

/* tooth chart */
.chartbox{overflow-x:auto}
.chartbox svg{min-width:640px;width:100%;height:auto;display:block}
.tooth path{stroke:var(--tooth-line);stroke-width:1.3;fill:var(--tooth)}
.tooth.decayed path{fill:var(--dec)}
.tooth.filled path{fill:var(--fil)}
.tooth.missing path{fill:var(--mis);stroke-dasharray:3 3}
.tooth.extracted path{fill:var(--ext)}
.tooth text{font-size:11px;fill:var(--muted);text-anchor:middle;font-family:var(--f-body)}
.tooth .x{stroke:var(--ink);stroke-width:2;opacity:.7;fill:none}
.tooth.edit{cursor:pointer}
.tooth.edit:hover path{stroke:var(--pri);stroke-width:2.2}
.brush{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.brush button{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:13px}
.brush button.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
.brush i{width:12px;height:12px;border-radius:4px;border:1px solid var(--tooth-line);display:inline-block}

/* modal + toast */
.mback{position:fixed;inset:0;background:rgba(6,20,24,.55);z-index:60;display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--surface);border-radius:14px;max-width:640px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.modal.wide{max-width:860px}
.modal header{padding:16px 18px 6px;display:flex;justify-content:space-between;gap:10px}
.modal .body{padding:6px 18px 12px;overflow:auto}
.modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,520px)}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:14px}
.toast.bad{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:tin .18s ease-out}
  @keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}

/* responsive */
@media (max-width:1080px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:50;transform:translateX(-102%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px));box-shadow:0 0 40px rgba(0,0,0,.3)}
  .side.open{transform:none}
  .top{padding:10px 14px}
  .top .menu{display:grid}
  .switch select{max-width:52vw}
  .view{padding:16px 14px}
  .proto{padding:7px 14px}
  .g2,.g3,.g4,.g5{grid-template-columns:minmax(0,1fr)}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .kv{grid-template-columns:120px 1fr}
  .barrow{grid-template-columns:100px 1fr 40px}
}

</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<script>
/* ===== Constants and helpers ===== */
const TODAY = '2026-09-21';
const NEAR_MONTHS = 3;
const CAT_EXAM = 'Oral examination', CAT_EXT = 'Extraction', CAT_OTHER = 'Other procedure';
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const TYPE = { student: 'Student', faculty: 'Faculty', personnel: 'Personnel' };
const TIMES = ['08:00','09:00','10:00','11:00','13:00','14:00','15:00'];
const STAGES = ['Referred','Contacted','Availed','Completed'];
const COND_OPTS = ['Asthma','Diabetes','High blood pressure','Heart condition','Bleeding problems','Hepatitis','Kidney disease'];
const PAST_OPTS = ['Cleaning','Filling','Extraction','Root canal','Braces','Gum treatment'];
const CAMPUSES_SEED = [
  { id: 'main', name: 'Main Campus' },
  { id: 'sa', name: 'Satellite Campus A' },
  { id: 'sb', name: 'Satellite Campus B' }
];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function pd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function iso(x) { return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); }
function addDays(s, n) { const x = pd(s); x.setDate(x.getDate() + n); return iso(x); }
function addMonths(s, n) { const x = pd(s); x.setMonth(x.getMonth() + n); return iso(x); }
function fmtDate(s, long) { if (!s) return '-'; const x = pd(s); return (long ? DAYS[x.getDay()] + ', ' : '') + MONTHS[x.getMonth()].slice(0, 3) + ' ' + x.getDate() + ', ' + x.getFullYear(); }
function fmtTime(t) { const [h, m] = t.split(':').map(Number); return (((h + 11) % 12) + 1) + ':' + String(m).padStart(2, '0') + ' ' + (h >= 12 ? 'PM' : 'AM'); }
function ymLabel(m) { const [y, mo] = m.split('-').map(Number); return MONTHS[mo - 1] + ' ' + y; }
const ym = s => s.slice(0, 7);
function daysBetween(a, b) { return Math.round((pd(b) - pd(a)) / 86400000); }
let _uid = 1000; const nid = p => p + (++_uid);
function weekdays(from, n) { const out = []; let d = from; while (out.length < n) { const w = pd(d).getDay(); if (w !== 0 && w !== 6) out.push(d); d = addDays(d, 1); } return out; }
const SLOT_DAYS = weekdays('2026-09-21', 10);

const patient = id => S.patients.find(p => p.id === id);
const med = id => S.medicines.find(m => m.id === id);
const svc = id => S.services.find(s => s.id === id);
const campusName = id => (S.campuses.find(c => c.id === id) || { name: id }).name;
const isMainStaff = pr => pr.role === 'staff' && pr.campus === 'main';
const inSY = d => d >= S.sy.start && d <= S.sy.end;

function stockStatus(expiry) {
  if (expiry < TODAY) return 'expired';
  return expiry <= addMonths(TODAY, NEAR_MONTHS) ? 'near' : 'ok';
}
function statusPill(st) {
  return st === 'expired' ? '<span class="pill bad">Expired</span>' : st === 'near' ? '<span class="pill warn">Near expiry</span>' : '<span class="pill ok">OK</span>';
}
function batchesOf(campus, medId) { return S.batches.filter(b => b.campus === campus && (!medId || b.medId === medId) && b.qty > 0).sort((a, b) => a.expiry.localeCompare(b.expiry)); }
function stockQty(campus, medId) { return batchesOf(campus, medId).reduce((s, b) => s + b.qty, 0); }
function expiryCounts(campus) {
  const bs = batchesOf(campus); return { expired: bs.filter(b => stockStatus(b.expiry) === 'expired').length, near: bs.filter(b => stockStatus(b.expiry) === 'near').length };
}
function firstVisitDate(pid, campus) {
  const v = S.visits.filter(x => x.patientId === pid && x.campus === campus && inSY(x.date)).map(x => x.date).sort(); return v[0] || null;
}
function isFirstTimeFor(pid, campus, date) {
  if (!inSY(date)) return false;
  return !S.visits.some(x => x.patientId === pid && x.campus === campus && inSY(x.date) && x.date < date);
}
function monthStats(campus, m) {
  const vs = S.visits.filter(v => v.campus === campus && ym(v.date) === m);
  const cat = c => vs.reduce((n, v) => n + v.services.filter(id => svc(id) && svc(id).category === c).length, 0);
  const pids = [...new Set(vs.map(v => v.patientId))];
  let first = 0, ret = 0; const byType = { student: 0, faculty: 0, personnel: 0 };
  pids.forEach(pid => { const f = firstVisitDate(pid, campus); if (f && ym(f) === m) first++; else ret++; byType[patient(pid).type]++; });
  const ds = S.rx.filter(r => r.campus === campus && r.status === 'Dispensed' && r.dispensedOn && ym(r.dispensedOn) === m);
  return {
    visits: vs.length, consult: vs.filter(v => v.consult).length, exams: cat(CAT_EXAM), extractions: cat(CAT_EXT), procedures: cat(CAT_OTHER),
    served: pids.length, first, ret, byType, medRecords: ds.length, medQty: ds.reduce((n, r) => n + r.qty, 0)
  };
}
function sumStats(list) {
  const t = { visits: 0, consult: 0, exams: 0, extractions: 0, procedures: 0, served: 0, first: 0, ret: 0, byType: { student: 0, faculty: 0, personnel: 0 }, medRecords: 0, medQty: 0 };
  list.forEach(s => { ['visits', 'consult', 'exams', 'extractions', 'procedures', 'served', 'first', 'ret', 'medRecords', 'medQty'].forEach(k => t[k] += s[k]); Object.keys(t.byType).forEach(k => t.byType[k] += s.byType[k]); });
  return t;
}
function historyDiff(oldH, newH, by) {
  const out = [], ts = TODAY + ' ' + new Date().toTimeString().slice(0, 5);
  const j = a => (a && a.length ? a.join(', ') : 'None');
  [['Medical conditions', 'conditions', j], ['Allergies', 'allergies', x => x || 'None'], ['Current medications', 'medications', x => x || 'None'], ['Past dental treatment', 'pastTreatment', j]].forEach(([label, key, f]) => {
    const a = f(oldH[key]), b = f(newH[key]);
    if (a !== b) out.push({ id: nid('h'), ts, by, field: label, from: a, to: b, seen: !/\(patient\)/.test(by) });
  });
  return out;
}

function modal(title, body, footer, wide) {

function closeModal() { const m = document.getElementById('mroot'); if (m) m.remove(); }

function slotState(campus, date, time, ignoreId) {

    (re ? `<div class="callout warn">You are moving your appointment on <b>${fmtDate(re.date, true)} at ${fmtTime(re.time)}</b>. The new request goes back to Pending for staff approval (to confirm with the clinic).</div>` : '') +

    <h3 style="margin-top:18px">3. Reason for the visit (optional)</h3>

function submitBooking() {

    const a = S.appts.find(x => x.id === b.resched); a.date = b.date; a.time = b.time; a.status = 'Pending'; if (b.reason) a.reason = b.reason;

/* ---- Tooth chart ---- */
const UPPER = ['18', '17', '16', '15', '14', '13', '12', '11', '21', '22', '23', '24', '25', '26', '27', '28'];
const LOWER = ['48', '47', '46', '45', '44', '43', '42', '41', '31', '32', '33', '34', '35', '36', '37', '38'];
const COND = { sound: 'Sound', decayed: 'Decayed', filled: 'Filled', missing: 'Missing', extracted: 'Extracted' };
const COND_VAR = { sound: 'var(--tooth)', decayed: 'var(--dec)', filled: 'var(--fil)', missing: 'var(--mis)', extracted: 'var(--ext)' };
function toothKind(n) { const k = +n[1]; return k >= 6 ? 'molar' : k >= 4 ? 'premolar' : k === 3 ? 'canine' : 'incisor'; }
function rr(x, y, w, h, r) { return `M${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x + r}Q${x},${y + h} ${x},${y + h - r}V${y + r}Q${x},${y} ${x + r},${y}Z`; }
function toothG(n, i, upper, cond, editable) {
  const x0 = 14 + i * 42 + (i >= 8 ? 16 : 0), cx = x0 + 21, kind = toothKind(n);
  const w = { molar: 34, premolar: 26, canine: 22, incisor: 22 }[kind], x = cx - w / 2, ch = 30, rh = 20;
  const yc = upper ? 40 : 144, crown = rr(x, yc, w, ch, 9);
  const yb = upper ? yc : yc + ch, tip = upper ? yc - rh : yc + ch + rh;
  const root = kind === 'molar' ? `M${x + 3},${yb}L${x + w * 0.28},${tip}L${x + w * 0.5},${yb}L${x + w * 0.72},${tip}L${x + w - 3},${yb}Z` : `M${x + w * 0.2},${yb}L${cx},${tip}L${x + w * 0.8},${yb}Z`;
  const ly = upper ? 88 : 134;
  const cls = 'tooth ' + (cond && cond !== 'sound' ? cond : '') + (editable ? ' edit' : '');
  const xm = cond === 'extracted' ? `<path class="x" d="M${x + 4},${yc + 4}L${x + w - 4},${yc + ch - 4}M${x + w - 4},${yc + 4}L${x + 4},${yc + ch - 4}"/>` : '';
  return `<g class="${cls}" ${editable ? `role="button" tabindex="0" onclick="toothClick('${n}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toothClick('${n}')}"` : ''}><title>Tooth ${n}: ${COND[cond || 'sound']}</title><path fill="#FFFFFF" stroke="#6E8990" d="${root}"/><path fill="#FFFFFF" stroke="#6E8990" d="${crown}"/>${xm}<text x="${cx}" y="${ly}">${n}</text></g>`;
}
function chartSvg(teeth, editable) {
  return `<svg viewBox="0 0 700 208" role="img" aria-label="Tooth chart"><text x="14" y="12" style="font-size:11px;fill:var(--muted)">Patient's right</text><text x="686" y="12" style="font-size:11px;fill:var(--muted);text-anchor:end">Patient's left</text>${UPPER.map((n, i) => toothG(n, i, true, teeth[n], editable)).join('')}${LOWER.map((n, i) => toothG(n, i, false, teeth[n], editable)).join('')}</svg>`;
}
function chartCounts(teeth) {
  const v = Object.values(teeth); const c = k => v.filter(x => x === k).length;
  return `<span class="pill">Decayed: ${c('decayed')}</span> <span class="pill">Filled: ${c('filled')}</span> <span class="pill">Missing or extracted: ${c('missing') + c('extracted')}</span>`;
}
function brushBar() { return `<div class="brush" role="group" aria-label="Tooth condition">${Object.keys(COND).map(k => `<button class="${UI.brush === k ? 'on' : ''}" onclick="setBrush('${k}')"><i style="background:${COND_VAR[k]}"></i>${COND[k]}</button>`).join('')}</div>`; }
function setBrush(k) { readDraftFields(); UI.brush = k; render(); }
function toothClick(n) {
  if (!UI.draft) return;
  if (UI.brush === 'sound') delete UI.draft.teeth[n]; else UI.draft.teeth[n] = UI.brush;
  const w = document.getElementById('chartwrap'); if (w) w.innerHTML = chartSvg(UI.draft.teeth, true);
  const c = document.getElementById('chartcounts'); if (c) c.innerHTML = chartCounts(UI.draft.teeth);
}
function readDraftFields() { if (!UI.draft) return; UI.draft.gum = val('o_gum') || UI.draft.gum; UI.draft.findings = val('o_find'); UI.draft.needs = val('o_needs'); UI.draft.remarks = val('o_rem'); }
function saveExam() {
  const p = patient(UI.params.id); readDraftFields(); const d = UI.draft;
  p.exams.unshift({ id: nid('e'), date: TODAY, by: cur().name, teeth: Object.assign({}, d.teeth), gum: d.gum, findings: d.findings, needs: d.needs, remarks: d.remarks });
  UI.draft = null; toast('Exam saved to the oral health profile.'); render();
}
function viewExam(id) {
  const p = patient(UI.params.id), e = p.exams.find(x => x.id === id);
  modal('Exam on ' + fmtDate(e.date), `<div class="chartbox">${chartSvg(e.teeth, false)}</div><p>${chartCounts(e.teeth)}</p><dl class="kv"><dt>Gums</dt><dd>${esc(e.gum)}</dd><dt>Findings</dt><dd>${esc(e.findings)}</dd><dt>Treatment needed</dt><dd>${esc(e.needs || 'None')}</dd><dt>Remarks</dt><dd>${esc(e.remarks || '-')}</dd><dt>Recorded by</dt><dd>${esc(e.by)}</dd></dl>`, '', true);

      : `<div class="card"><h2>Dispensing log</h2>${tbl(['When', 'Patient', 'Medicine', 'Qty', 'Dispensed by'], done.map(r => [esc(r.dispensedAt), esc(patient(r.patientId).name), esc(med(r.medId).name), r.qty, esc(r.dispensedBy)]))}</div>`);

function openRx(pid) {
  const pr = cur(), pats = campusPatients();
  const body = `<div class="form">${field('Patient', `<select class="in" id="rx_pat" onchange="rxCheck()"><option value="">Choose a patient</option>${opt(pats.map(p => [p.id, p.name]), pid || '')}</select>`)}
    <div id="rx_alert"></div>
    ${field('Medicine', `<select class="in" id="rx_med" onchange="rxCheck()"><option value="">Choose a medicine</option>${opt(S.medicines.map(m => [m.id, m.name + ' (in stock: ' + stockQty(pr.campus, m.id) + ')']), '')}</select>`)}
    <div class="fgrid">${field('Quantity', '<input type="number" id="rx_qty" min="1" value="10">')}${field('Directions', '<input type="text" id="rx_dir" placeholder="For example: 1 capsule every 8 hours for 7 days">')}</div></div>`;
  modal('New prescription', body, `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveRx()">Save prescription</button>`);
  rxCheck();
}
function rxCheck() {
  const pid = val('rx_pat'), mid = val('rx_med'), box = document.getElementById('rx_alert'); if (!box) return;
  if (!pid) { box.innerHTML = ''; return; }
  const p = patient(pid), al = allergyOf(p); let html = '';
  if (al) html += `<div class="rxwarn"><b>Allergy on file:</b> ${esc(al)}.${mid && med(mid).keys.some(k => al.toLowerCase().includes(k)) ? ' <b>This medicine may conflict with the allergy.</b>' : ''}</div>`;
  if (!p.history.reviewed) html += `<div class="callout warn" style="margin-top:8px">This patient's dental history has changes you have not reviewed yet.</div>`;
  box.innerHTML = html;
}
function saveRx() {
  const pr = cur(), pid = val('rx_pat'), mid = val('rx_med'), qty = parseInt(val('rx_qty'), 10);
  if (!pid || !mid || !qty || qty < 1) { toast('Choose a patient and a medicine, and enter a quantity.', true); return; }
  const lv = lastVisit(pid);
  S.rx.push({ id: nid('rx'), patientId: pid, visitId: lv ? lv.id : null, campus: pr.campus, medId: mid, dosage: val('rx_dir') || 'As directed', qty, prescribedBy: pr.name, date: TODAY, status: 'Prescribed', dispensedBy: null, dispensedOn: null, dispensedAt: null });
  closeModal(); toast('Prescription saved. It is ready to be dispensed.'); render();
}
function planDispense(campus, medId, qty) {
  let need = qty; const plan = [];
  for (const b of batchesOf(campus, medId)) { if (need <= 0) break; const take = Math.min(b.qty, need); plan.push({ b, take }); need -= take; }
  return { plan, short: need > 0 ? need : 0 };
}
function dispenseRx(id) {
  const r = S.rx.find(x => x.id === id), m = med(r.medId), { plan, short } = planDispense(r.campus, r.medId, r.qty);
  if (short) { toast('Not enough stock of ' + m.name + '. Short by ' + short + '.', true); return; }
  const rows = plan.map(x => `<li>${x.take} from lot ${esc(x.b.lot)}, expires ${fmtDate(x.b.expiry)} ${statusPill(stockStatus(x.b.expiry))}</li>`).join('');
  window._doDispense = () => {
    const pr = cur(), now = TODAY + ' ' + new Date().toTimeString().slice(0, 5);
    plan.forEach(x => { x.b.qty -= x.take; S.ledger.unshift({ id: nid('l'), date: TODAY, campus: r.campus, medId: r.medId, lot: x.b.lot, type: 'Dispensed', qty: -x.take, by: pr.name, reason: 'Prescription' }); });
    Object.assign(r, { status: 'Dispensed', dispensedBy: pr.name, dispensedOn: TODAY, dispensedAt: now });
    closeModal(); toast('Dispensed. Stock updated automatically.'); render();
  };
  modal('Dispense medicine', `<p><b>${esc(patient(r.patientId).name)}</b>: ${r.qty} ${esc(m.unit)} of ${esc(m.name)}.</p><p class="muted small">Stock is taken from the batches that expire first:</p><ul>${rows}</ul><p class="muted small">Dispensed by ${esc(cur().name)}. The name and time are saved with the record.</p>`, `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="_doDispense()">Dispense</button>`);
}

function saveStockIn() {

}
function repMonthly() {
  const cs = repCampuses(), m = UI.rf.month, st = cs.map(c => monthStats(c, m)), tot = sumStats(st), multi = cs.length > 1;
  const rows = [
    ['Number of dental consultations', s => s.consult, 'Definition to confirm'],
    ['Number of oral examinations', s => s.exams, ''],
    ['Number of tooth extractions', s => s.extractions, ''],
    ['Number of dental procedures performed', s => s.procedures, 'Do extractions also count here?'],
    ['Number of patients served', s => s.served, 'Unique patients'],
    ['First-time clients', s => s.first, 'First visit in the school year'],
    ['Returning clients', s => s.ret, ''],
    ['Students served', s => s.byType.student, ''],
    ['Faculty served', s => s.byType.faculty, ''],
    ['Personnel served', s => s.byType.personnel, ''],
    ['Number of medicines dispensed', s => s.medRecords + '<div class="muted small">' + s.medQty + ' units</div>', 'Prescriptions, items, or units?']
  ];
  return repFilters(['month', 'campus', 'sy']) +
    `<div class="card"><h2>Monthly dental service report, ${ymLabel(m)}</h2><p class="sub">Calculated from visit and dispensing records. Nothing is typed in.</p>
    ${tbl(['Metric', ...cs.map(campusName), ...(multi ? ['All campuses'] : []), 'Note'], rows.map(([l, f, n]) => [l, ...st.map(s => f(s)), ...(multi ? [f(tot)] : []), `<span class="muted small">${n}</span>`]), { num: cs.map((_, i) => i + 1).concat(multi ? [cs.length + 1] : []) })}</div>
    <div class="callout warn" style="margin-top:16px"><b>Notes for the clinic.</b> The service lines overlap, so they do not add up to the number of visits. A patient seen at two campuses counts once at each, so the all-campus column can count that person twice. First-time counts reset each school year.</div>`;
}
function repReferral() {
  const cs = repCampuses(), pr = cur(), st = UI.rf.stage, sts = ['Referred', 'Contacted', 'Availed', 'Completed', 'Pending'];
  const rows = cs.map(c => { const rs = S.referrals.filter(r => r.campus === c); return [campusName(c), ...sts.map(s => rs.filter(r => r.status === s).length), rs.length]; });
  const own = S.referrals.filter(r => r.campus === pr.campus && r.status !== 'Completed' && (st === 'all' || r.status === st)).sort((a, b) => a.dates.Referred.localeCompare(b.dates.Referred));
  return repFilters(['campus', 'stage']) +
    `<div class="card"><h2>Referral monitoring</h2><p class="sub">How many referrals are at each stage now.</p>${tbl(['Campus', ...sts, 'Total'], rows, { num: [1, 2, 3, 4, 5, 6] })}</div>
    <div class="card"><h2>Still open at ${campusName(pr.campus)}</h2><p class="sub">Names appear for your own campus only.</p>${tbl(['Patient', 'Referred to', 'Status', 'Referred on', 'Days since referral'], own.map(r => [esc(patient(r.patientId).name), esc(r.referredTo), refPill(r.status), fmtDate(r.dates.Referred), daysBetween(r.dates.Referred, TODAY)]), { num: [4], empty: 'Nothing open.' })}</div>`;
}
function repMedicine() {
  const cs = repCampuses(), pr = cur(), m = UI.rf.month, mf = UI.rf.med;
  const meds = S.medicines.filter(x => mf === 'all' || x.id === mf);
  const stockRows = meds.map(x => [esc(x.name), ...cs.map(c => stockQty(c, x.id))]);
  const expRows = cs.map(c => { const e = expiryCounts(c); return [campusName(c), e.expired, e.near]; });
  const dispRows = meds.map(x => [esc(x.name), ...cs.map(c => { const ds = S.rx.filter(r => r.campus === c && r.medId === x.id && r.status === 'Dispensed' && r.dispensedOn && ym(r.dispensedOn) === m); return ds.length + ' (' + ds.reduce((n, r) => n + r.qty, 0) + ' units)'; })]);
  const ownExp = batchesOf(pr.campus).filter(b => stockStatus(b.expiry) !== 'ok' && (mf === 'all' || b.medId === mf));
  const lg = S.ledger.filter(l => l.campus === pr.campus && (mf === 'all' || l.medId === mf)).sort((a, b) => b.date.localeCompare(a.date));
  return repFilters(['month', 'campus', 'med']) +
    `<div class="card"><h2>Current stock</h2><p class="sub">Total quantity per campus. Stock is not patient data, so other campuses are visible (to confirm).</p>${tbl(['Medicine', ...cs.map(campusName)], stockRows, { num: cs.map((_, i) => i + 1) })}</div>
    <div class="card"><h2>Expired and near expiry</h2>${tbl(['Campus', 'Expired batches', 'Near-expiry batches'], expRows, { num: [1, 2] })}<h3 style="margin-top:16px">Batch details at ${campusName(pr.campus)}</h3>${tbl(['Medicine', 'Lot', 'Expiry', 'Qty', 'Status'], ownExp.map(b => [esc(med(b.medId).name), esc(b.lot), fmtDate(b.expiry), b.qty, statusPill(stockStatus(b.expiry))]), { num: [3], empty: 'No expired or near-expiry batches.' })}</div>
    <div class="card"><h2>Medicines dispensed, ${ymLabel(m)}</h2><p class="sub">Prescriptions dispensed and units. Counts only for other campuses.</p>${tbl(['Medicine', ...cs.map(campusName)], dispRows, { num: cs.map((_, i) => i + 1) })}</div>
    <div class="card"><h2>Stock in and out at ${campusName(pr.campus)}</h2>${tbl(['Date', 'Medicine', 'Lot', 'Type', 'Qty', 'By', 'Reason'], lg.map(l => [fmtDate(l.date), esc(med(l.medId).name), esc(l.lot), l.type, (l.qty > 0 ? '+' : '') + l.qty, esc(l.by), esc(l.reason)]), { num: [4] })}</div>`;
}
function repOperational() {
  const pr = cur(), r = UI.rf, c = pr.campus, m = r.month, op = r.op;
  const inMonth = d => ym(d) === m;
  const okType = pid => r.type === 'all' || patient(pid).type === r.type;
  let show = ['month', 'type'], table = '';
  if (op === 'visits') {
    const vs = S.visits.filter(v => v.campus === c && inMonth(v.date) && okType(v.patientId) && (r.service === 'all' || v.services.includes(r.service))).sort((a, b) => a.date.localeCompare(b.date));
    show.push('service');
    table = tbl(['Date', 'Patient', 'Type', 'Source', 'Consultation', 'Services', 'Dentist'], vs.map(v => [fmtDate(v.date), esc(patient(v.patientId).name), typePill(patient(v.patientId).type), v.source, v.consult ? 'Yes' : 'No', esc(svcNames(v.services)), esc(v.dentist)]), { empty: 'No visits match.' });
  } else if (op === 'procedures') {
    const rows = []; S.visits.filter(v => v.campus === c && inMonth(v.date) && okType(v.patientId)).sort((a, b) => a.date.localeCompare(b.date)).forEach(v => v.services.forEach(id => { const s = svc(id); if (s && s.category !== CAT_EXAM && (r.service === 'all' || r.service === id)) rows.push([fmtDate(v.date), esc(patient(v.patientId).name), esc(s.name), s.category === CAT_EXT ? '<span class="pill bad">Extraction</span>' : '<span class="pill info">Procedure</span>', esc(v.teeth || '-'), esc(v.dentist)]); }));
    show.push('service'); table = tbl(['Date', 'Patient', 'Service', 'Category', 'Teeth', 'Dentist'], rows, { empty: 'No procedures match.' });
  } else if (op === 'dispensing') {
    const ds = S.rx.filter(x => x.campus === c && x.status === 'Dispensed' && inMonth(x.dispensedOn) && okType(x.patientId) && (r.med === 'all' || x.medId === r.med)); show.push('med');
    table = tbl(['When', 'Patient', 'Medicine', 'Qty', 'Dispensed by'], ds.map(x => [esc(x.dispensedAt), esc(patient(x.patientId).name), esc(med(x.medId).name), x.qty, esc(x.dispensedBy)]), { empty: 'No dispensing records match.' });
  } else if (op === 'appts') {
    const as = S.appts.filter(a => a.campus === c && inMonth(a.date) && okType(a.patientId)).sort((a, b) => a.date.localeCompare(b.date));
    table = ['Pending', 'Approved', 'Completed', 'Declined', 'Cancelled'].map(s => { const g = as.filter(a => a.status === s); return g.length ? `<div class="card"><h3>${s} (${g.length})</h3>${tbl(['Date', 'Time', 'Patient', 'Reason'], g.map(a => [fmtDate(a.date), fmtTime(a.time), esc(patient(a.patientId).name), esc(a.reason || '-')]))}</div>` : ''; }).join('') || '<div class="empty">No appointments match.</div>';
  } else {
    const ps = campusPatients().filter(p => r.type === 'all' || p.type === r.type);
    table = ['student', 'faculty', 'personnel'].map(t => { const g = ps.filter(p => p.type === t); return g.length ? `<div class="card"><h3>${TYPE[t]} (${g.length})</h3>${tbl(['Name', 'ID', 'Program or unit', 'Registered'], g.map(p => [esc(p.name), esc(p.idNo), esc(p.unit), fmtDate(p.registered)]))}</div>` : ''; }).join('') || '<div class="empty">No patients match.</div>';
    show = ['type'];
  }
  const sel = field('Report', `<select class="in" onchange="UI.rf.op=this.value;render()">${opt([['visits', 'Daily visit log'], ['procedures', 'Extractions and procedures'], ['dispensing', 'Dispensing log'], ['appts', 'Appointments by status'], ['patients', 'Patient list by type']], op)}</select>`);
  return `<div class="callout">Operational reports contain patient names, so they cover <b>${campusName(c)}</b> only.</div><div class="filters">${sel}</div>${repFilters(show)}${table}`;
}
SCREENS.reports = function () {
  const tab = getTab('rep', 'monthly');
  const inner = tab === 'monthly' ? repMonthly() : tab === 'referral' ? repReferral() : tab === 'medicine' ? repMedicine() : repOperational();
  return head('Reports', isMainStaff(cur()) ? 'All campuses, per campus and combined. Patient names stay at the campus level.' : 'Reports for ' + campusName(cur().campus) + '.') +
    noteBar(['A', 'C'], 'The monthly report is client-required. Referral and medicine reports are optional items #8 and #9. Operational lists are team-proposed.', ['Is on-screen viewing enough, or does the clinic need PDF, Excel, or print? None is included here.', 'How is the monthly report submitted to university officials?', 'Does the report need to be approved or submitted by someone?', 'What counts as a consultation, and what does "medicines dispensed" count?', 'Is double counting a patient seen at two campuses acceptable in the combined total?']) +
    tabsBar('rep', [['monthly', 'Monthly report'], ['referral', 'Referrals'], ['medicine', 'Medicine and inventory'], ['ops', 'Operational lists']]) + inner;
};

/* ---- Accounts and setup (main campus Clinic Staff) ---- */
SCREENS.setup = function () {
  if (!isMainStaff(cur())) return '<div class="empty">Accounts and setup are managed by Clinic Staff at the main campus.</div>';
  const tab = getTab('setup', 'accounts'); let inner = '';
  if (tab === 'accounts') {
    inner = `<div class="card"><h2>Staff accounts</h2>${tbl(['Name', 'Role', 'Campus', 'Status', ''], S.accounts.map(a => [esc(a.name), a.role, campusName(a.campus), a.active ? '<span class="pill ok">Active</span>' : '<span class="pill">Deactivated</span>', `<button class="btn sm ${a.active ? 'danger' : ''}" onclick="toggleAccount('${a.id}')">${a.active ? 'Deactivate' : 'Reactivate'}</button>`]))}<p class="muted small" style="margin-top:8px">People who leave are deactivated, not deleted, so their past records stay traceable (to confirm).</p></div>`;
  } else if (tab === 'services') {
    inner = `<div class="card"><h2>Service list</h2><p class="sub">The category decides which line of the monthly report a service counts in.</p>${tbl(['Service', 'Category', 'Status', ''], S.services.map(s => [esc(s.name), s.category, s.active ? '<span class="pill ok">Active</span>' : '<span class="pill">Hidden</span>', `<button class="btn sm" onclick="toggleService('${s.id}')">${s.active ? 'Hide' : 'Show'}</button>`]))}</div>`;
  } else if (tab === 'medicines') {
    inner = `<div class="card"><h2>Medicine list</h2><p class="sub">Clinic Staff record quantities per campus under Inventory. One list is shared by all campuses (to confirm).</p>${tbl(['Medicine', 'Unit'], S.medicines.map(m => [esc(m.name), m.unit]))}</div>`;
  } else if (tab === 'campuses') {
    inner = `<div class="card"><h2>Campuses</h2>${tbl(['Campus', 'Type'], S.campuses.map(c => [esc(c.name), c.id === 'main' ? 'Main campus' : 'Satellite campus']))}</div>`;
  } else {
    inner = `<div class="card"><h2>School year</h2><p class="sub">Decides when a client counts as first-time.</p><div class="fgrid">${field('Label', `<input type="text" id="sy_l" value="${esc(S.sy.label)}">`)}<div></div>${field('Starts', `<input type="date" id="sy_s" value="${S.sy.start}">`)}${field('Ends', `<input type="date" id="sy_e" value="${S.sy.end}">`)}</div><div class="actions" style="margin-top:12px"><button class="btn pri" onclick="saveSY()">Save school year</button></div><p class="muted small" style="margin-top:10px">These dates are sample values. The clinic needs to confirm its school year and whether breaks count.</p></div>`;
  }
  const add = { accounts: `<button class="btn pri" onclick="openAccount()">Add account</button>`, services: `<button class="btn pri" onclick="openService()">Add service</button>`, medicines: `<button class="btn pri" onclick="openMedicine()">Add medicine</button>`, campuses: `<button class="btn pri" onclick="openCampus()">Add campus</button>`, sy: '' }[tab];
  return head('Accounts and setup', 'Managed by Clinic Staff at the main campus.', add) +
    noteBar(['D'], 'Recommended and essential: the reports and role rules cannot work without accounts, a service list with categories, a medicine list, campuses, and school year dates.', ['Should account and setup powers go to every main campus staff member, or only one or two people?', 'Who creates the first main campus account, and who covers if that person is unavailable?', 'Should edits to accounts and the service list be tracked?', 'Do all campuses share one service list and one medicine list?']) +
    tabsBar('setup', [['accounts', 'Accounts'], ['services', 'Services'], ['medicines', 'Medicines'], ['campuses', 'Campuses'], ['sy', 'School year']]) + inner;
};
function toggleAccount(id) { const a = S.accounts.find(x => x.id === id); a.active = !a.active; toast(a.active ? 'Account reactivated.' : 'Account deactivated. Past records stay on file.'); render(); }
function toggleService(id) { const s = svc(id); s.active = !s.active; render(); }
function openAccount() {
  modal('Add account', `<div class="form">${field('Full name', '<input type="text" id="ac_n">')}<div class="fgrid">${field('Role', `<select class="in" id="ac_r">${opt([['Dentist', 'Dentist'], ['Clinic Staff', 'Clinic Staff']], 'Clinic Staff')}</select>`)}${field('Campus', `<select class="in" id="ac_c">${opt(S.campuses.map(c => [c.id, c.name]), 'main')}</select>`)}</div></div>`, `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveAccount()">Add account</button>`);
}
function saveAccount() { const n = val('ac_n'); if (!n) { toast('Enter a name.', true); return; } S.accounts.push({ id: nid('u'), name: n, role: val('ac_r'), campus: val('ac_c'), active: true }); closeModal(); toast('Account added.'); render(); }
function openService() {
  modal('Add service', `<div class="form">${field('Service name', '<input type="text" id="sv_n">')}${field('Counts in this report line', `<select class="in" id="sv_c">${opt([CAT_EXAM, CAT_EXT, CAT_OTHER].map(x => [x, x]), CAT_OTHER)}</select>`)}${field('Description for patients', '<input type="text" id="sv_d">')}</div>`, `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveService()">Add service</button>`);
}
function saveService() { const n = val('sv_n'); if (!n) { toast('Enter a service name.', true); return; } S.services.push({ id: nid('s'), name: n, category: val('sv_c'), active: true, desc: val('sv_d') || 'Ask the clinic for details.' }); closeModal(); toast('Service added.'); render(); }
function openMedicine() {
  modal('Add medicine', `<div class="form">${field('Medicine name and strength', '<input type="text" id="md_n">')}${field('Unit', '<input type="text" id="md_u" value="tablets">')}</div>`, `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveMedicine()">Add medicine</button>`);
}
function saveMedicine() { const n = val('md_n'); if (!n) { toast('Enter a medicine name.', true); return; } S.medicines.push({ id: nid('m'), name: n, unit: val('md_u') || 'units', keys: [n.toLowerCase().split(' ')[0]] }); closeModal(); toast('Medicine added.'); render(); }
function openCampus() { modal('Add campus', `<div class="form">${field('Campus name', '<input type="text" id="cp_n" placeholder="For example: Satellite Campus C">')}</div>`, `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveCampus()">Add campus</button>`); }
function saveCampus() { const n = val('cp_n'); if (!n) { toast('Enter a campus name.', true); return; } S.campuses.push({ id: nid('c'), name: n }); closeModal(); toast('Campus added.'); render(); }
function saveSY() { const s = val('sy_s'), e = val('sy_e'); if (!s || !e || e <= s) { toast('Enter a start date that is before the end date.', true); return; } S.sy = { label: val('sy_l') || S.sy.label, start: s, end: e }; toast('School year saved. First-time counts now follow these dates.'); render(); }

/* ===== Route table and start-up ===== */
const IMPL = Object.assign({}, SCREENS);
const ROUTES = {
  home: { patient: IMPL.patHome, dentist: IMPL.dentHome, staff: IMPL.staffHome },
  appointments: { patient: IMPL.patAppts, staff: IMPL.appointments },
  book: { patient: IMPL.patBook },
  records: { patient: IMPL.patRecords },
  services: { patient: IMPL.patServices },
  announcements: { patient: IMPL.patAnn, staff: IMPL.annManage },
  notifications: { patient: IMPL.patNotifs },
  register: { patient: IMPL.register },
  patients: { dentist: IMPL.patients, staff: IMPL.patients },
  chart: { dentist: IMPL.chart, staff: IMPL.chart },
  visits: { dentist: IMPL.visits, staff: IMPL.visits },
  visit_new: { dentist: IMPL.visitNew, staff: IMPL.visitNew },
  medicines: { dentist: IMPL.medicines, staff: IMPL.medicines },
  referrals: { dentist: IMPL.referrals, staff: IMPL.referrals },
  inventory: { staff: IMPL.inventory },
  reports: { staff: IMPL.reports },
  setup: { staff: IMPL.setup }
};
Object.keys(ROUTES).forEach(r => {
  SCREENS[r] = () => { const f = ROUTES[r][cur().role]; return f ? f() : '<div class="empty">This screen is not available for this role.</div>'; };
});
function afterRender() { if (UI.route === 'visit_new' && cur().role === 'dentist') visitChanged(); }
render();

</script>
</body>
